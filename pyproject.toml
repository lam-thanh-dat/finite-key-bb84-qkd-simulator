[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finite-key-bb84-qkd-simulator"
version = "1.0.3"
description = "A reproducible educational simulator for BB84 QKD and illustrative finite-key penalties."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Lam Thanh Dat" },
]
keywords = [
  "BB84",
  "finite-key analysis",
  "quantum communication",
  "quantum key distribution",
  "simulation",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "ruff==0.16.0",
]

[project.scripts]
bb84-qkd = "bb84_qkd.bb84_cli:main"
bb84-qkd-gui = "bb84_qkd.bb84_gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
