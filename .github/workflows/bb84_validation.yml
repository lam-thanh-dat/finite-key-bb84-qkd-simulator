name: BB84 validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: python -m ruff check src tests scripts

      - name: Verify Ruff formatting
        run: python -m ruff format --check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Compile sources
        run: python -m compileall -q src tests scripts

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-test result generation
        env:
          MPLBACKEND: Agg
        run: python scripts/reproduce_bb84_results.py --quick --output-dir /tmp/bb84-results

  reproducibility:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install locked research environment
        run: |
          python -m pip install \
            --require-hashes \
            -r requirements-reproducibility.lock
          python -m pip install -e . --no-deps --no-build-isolation

      - name: Verify tracked numerical results
        env:
          MPLBACKEND: Agg
        run: python scripts/reproduce_bb84_results.py --check
